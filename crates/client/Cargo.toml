[package]
edition = "2021"
name = "client"
version = "0.1.0"

[dependencies]
engine.path = "../engine"

bevy = { workspace = true, default-features = true }
bevy-inspector-egui = "0.34"
bevy_egui = { version = "0.37.0", features = ["serde"] }

# FIXME
# bevy_framepace = "0.19.1"
bevy_framepace = { git = "https://github.com/TotalKrill/bevy_framepace" }

bevy_hanabi = { version = "0.17.0", default-features = false, features = ["3d"] }
bevy_rapier3d.workspace = true
clap = { version = "4.5.48", features = ["derive"] }
color-eyre.workspace = true
directories = "6"
i18n-embed = { version = "0.16.0", features = ["desktop-requester", "fluent-system"] }
i18n-embed-fl = "0.10.0"
itertools = "0.14"
leafwing-input-manager = "0.18.0"
rand = "0.9"
rust-embed = { version = "8.7.2", features = ["interpolate-folder-path"] }
serde = "1"
serde_json = "1"
smallvec.workspace = true
subenum.workspace = true
thiserror = "2"
tracing.workspace = true
# iyes_progress = { version = "0.13.0", features = ["assets"] }
# bevy-ui-navigation = "0.33.1"

[lints]
workspace = true
